[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmasolve-rh-contracts-ab"
version = "0.1.0"
description = "SigmaSolve RH Contracts A and B"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sigmasolve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
