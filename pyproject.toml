[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standing-guard"
version = "0.1.0"
description = "Drop-in drift governor that refuses proxy-improving steps which decrease standing"
readme = "standing_guard/README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
standing-guard = "standing_guard.__main__:main"

[project.optional-dependencies]
test = []

[tool.setuptools]
packages = ["standing_guard"]
